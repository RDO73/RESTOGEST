name: RestoGest V1 CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restogest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck, frontend syntax check & build
        run: |
          npx tsc --noEmit
          for f in src/public/js/*.js; do node --check "$f"; done
          npm run build

      - name: Production dependency security audit (report)
        run: npm audit --omit=dev --audit-level=high || true

      - name: Run unit & integration tests (PGlite embedded)
        env:
          JWT_SECRET: ci-test-jwt-secret-key-minimum-32-chars
        run: npm test -- --testTimeout=15000

      - name: Run SQL static checks, PGlite 40/40 & ordered migrations validation
        run: node tests/validate_restogest.mjs

      - name: Apply SQL migrations (001..008) on PostgreSQL 16 & set role passwords
        env:
          PGPASSWORD: postgres
          DATABASE_TYPE: postgres
          DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/restogest
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/restogest
        run: |
          npm run db:migrate
          psql -h 127.0.0.1 -U postgres -d restogest -v ON_ERROR_STOP=1 -c "ALTER ROLE restogest_admin WITH PASSWORD 'restogest_admin_pass';" -c "ALTER ROLE restogest_app WITH PASSWORD 'restogest_app_pass';"

      - name: Execute PostgreSQL 40-scenario security & integrity suite
        env:
          PGPASSWORD: restogest_admin_pass
        run: psql -h 127.0.0.1 -U restogest_admin -d restogest -v ON_ERROR_STOP=1 -f tests/test_suite_v1.sql

      - name: Execute parallel multi-session TCP concurrency suite
        env:
          DATABASE_ADMIN_URL: postgresql://restogest_admin:restogest_admin_pass@127.0.0.1:5432/restogest
          DATABASE_URL: postgresql://restogest_app:restogest_app_pass@127.0.0.1:5432/restogest
        run: node tests/concurrency_pg.mjs

      - name: Run HTTP integration tests against external PostgreSQL 16
        env:
          DATABASE_TYPE: postgres
          DATABASE_ADMIN_URL: postgresql://restogest_admin:restogest_admin_pass@127.0.0.1:5432/restogest
          DATABASE_URL: postgresql://restogest_app:restogest_app_pass@127.0.0.1:5432/restogest
          JWT_SECRET: ci-test-jwt-secret-key-minimum-32-chars
        run: npx vitest run tests/modules.integration.test.ts tests/security-hardening.integration.test.ts --testTimeout=15000
